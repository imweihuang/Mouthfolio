name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI passed
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Check contract, boundary, types, design and behavior
        run: npm run check
      - name: Inspect complete candidate history
        run: npm run check:history
      - name: Build production client
        run: npm run build
      - name: Install Chromium for the focused browser checks
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify production UI and route boundary
        run: npm run test:browser
